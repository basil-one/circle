output:
  filename: circle3-paper.pdf
  directory: assets/pdfs

metadata:
  title: Circle3 - Make Change Clear and Aligned
  author: Michael Basil
  date: June 2026
  email: michael@basil.one
  url: https://circle.basil.one
  keywords:
    - pattern language
    - change leadership
    - organizational change
    - complexity
    - sensemaking

framing:
  title: Circle3
  subtitle: A Pattern Language for Leading Change in Complex Environments
  images:
    - images/index.png
    - images/method.png
  toc_label: Table of Contents
  abstract_label: Abstract
  abstract_anchor: abstract
  abstract_file: content/plop.paper.abstract.md
  include_abstract_in_toc: true

body:
  introduction_label: Introduction
  introduction_anchor: introduction
  introduction_file: content/plop.paper.introduction.md
  include_introduction_in_toc: true
  back_matter_label: References and Acknowledgements
  back_matter_anchor: references
  back_matter_file: content/plop.paper.back-matter.md
  include_back_matter_in_toc: true

# PDF-only in-text citation markers, matched by link URL or literal text and
# appended right after the match. This lets the PDF carry academic in-text
# citations (matching the numbered References list) without editing
# _moves/_lenses, which are shared with the website. Numbers must match the
# order of entries in content/plop.paper.back-matter.md (alphabetical by
# first author surname): [1] Hawkins, [2] Lieberman et al., [3] Manns &
# Rising, [4] Snowden & Boone, [5] Voss & Raz, [6] Whitelaw.
citations:
  - url: https://www.youtube.com/watch?v=N7oz366X0-8
    annotation: "[4]"
  - url: https://zenleader.global/resources/febi-assessment
    annotation: "[6]"
  - url: https://zenleader.global
    annotation: "[6]"
  - url: https://fearlesschangepatterns.com
    annotation: "[3]"
  - url: https://www.goodreads.com/en/book/show/19795.Power_vs_Force
    annotation: "[1]"
  - text: "**affect labeling**"
    annotation: "[2]"
  - text: "**dynamic silence**"
    annotation: "[5]"

sections:
  - title: Three Guiding Moves
    include_in_toc: true
    intro_image: images/moves.png
    patterns:
      - file: _moves/establish.md
        intro_image: images/move-establish.png
      - file: _moves/integrate.md
        intro_image: images/move-integrate.png
      - file: _moves/reconcile.md
        intro_image: images/move-reconcile.png

  - title: Appendix: Leadership Lenses
    include_in_toc: true
    intro_image: images/lenses.png
    patterns:
      - file: _lenses/sense.md
        intro_image: images/lens-sense.png
      - file: _lenses/energy.md
        intro_image: images/lens-energy.png
      - file: _lenses/paradigm.md
        intro_image: images/lens-paradigm.png

conclusion:
  title: Conclusion
  anchor: conclusion
  image: images/conclusion.png
  main_text_file: content/plop.paper.conclusion.md
