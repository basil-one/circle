name: "Paper: Preview"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-preview:
    name: "Paper: Preview"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout intended revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build fresh author-edition PDF
        run: bash scripts/build-paper-pdf.sh
      - name: Upload PDF preview
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: circle3-paper-preview
          path: assets/pdfs/circle3-paper.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Link preview from workflow summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "[Download the preview PDF]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
