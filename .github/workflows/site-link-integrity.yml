name: "Site: Link Integrity"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      status:
        description: Site Link audit outcome
        value: ${{ jobs.site-link-integrity.outputs.status }}

permissions:
  contents: read

jobs:
  site-link-integrity:
    name: "Site: Link Integrity"
    outputs:
      status: ${{ steps.link_audit.outputs.status }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout intended revision
        id: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - name: Build site
        id: build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Test link auditor
        id: link_tests
        run: python3 -m unittest discover -s tests/site -p 'test_site_links.py'
      - name: Audit generated site links
        id: link_audit
        run: |
          set +e
          python3 -m scripts.site.check_links \
            --site-dir _site \
            --config _config.yml \
            --report "$RUNNER_TEMP/link-audit-report.md" \
            --status-file "$RUNNER_TEMP/link-audit-status" \
            --fail-on-likely-external
          result=$?
          set -e
          status="$(cat "$RUNNER_TEMP/link-audit-status" 2>/dev/null || true)"
          if [ "$result" -ne 0 ] && [ "$status" != failure ]; then
            status=incomplete
          fi
          if [ "$status" != success ] && [ "$status" != advisory ] && [ "$status" != failure ]; then
            status=incomplete
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = failure ] || [ "$status" = incomplete ]; then
            exit 1
          fi
      - name: Add link audit report to job summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          TEST_OUTCOME: ${{ steps.link_tests.outcome }}
          AUDIT_OUTCOME: ${{ steps.link_audit.outcome }}
          AUDIT_STATUS: ${{ steps.link_audit.outputs.status }}
        run: |
          summary_outcome() {
            case "$1" in
              success) printf -- "- %s: **passed**.\n" "$2" ;;
              failure) printf -- "- %s: **failed**; see logs.\n" "$2" ;;
              *) printf -- "- %s: **not completed**; see prior logs.\n" "$2" ;;
            esac
          }
          {
            echo "# Site: Link Integrity"
            echo
            echo "Checked-out revision: \`${SOURCE_SHA:-unavailable}\`."
            echo
            summary_outcome "$BUILD_OUTCOME" "Production Jekyll build"
            summary_outcome "$TEST_OUTCOME" "Link-auditor unit tests"
            summary_outcome "$AUDIT_OUTCOME" "Generated-site link audit"
            case "$AUDIT_STATUS" in
              success) echo "- Link evidence: **healthy**." ;;
              advisory) echo "- Link evidence: **advisory**; uncertain external responses were reported below." ;;
              failure) echo "- Link evidence: **failed**; confirmed link defects were reported below." ;;
              *) echo "- Link evidence: **incomplete**; evidence was not established." ;;
            esac
            if [ -f "$RUNNER_TEMP/link-audit-report.md" ]; then
              cat "$RUNNER_TEMP/link-audit-report.md"
            else
              echo "- Link report unavailable."
              echo "  See audit step logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
