name: "Site: Rendering Integrity"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: site-rendering-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: "Site: Rendering Integrity"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Build site
        id: build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run rendered-site smoke tests
        id: smoke
        run: npm run test:browser -- --reporter=json
        env:
          CI: 'true'
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/browser-results.json
      - name: Verify missing-route diagnostic
        id: negative
        run: |
          output="$RUNNER_TEMP/browser-negative.log"
          diagnostic='Expected /__browser-test-missing-route__/'
          diagnostic="$diagnostic to return HTTP 200"
          if npm run \
            test:browser:negative >"$output" 2>&1; then
            cat "$output"
            echo "Expected the deliberately missing route test to fail."
            exit 1
          fi
          cat "$output"
          grep -F "$diagnostic" "$output"
          grep -F 'received HTTP 404' "$output"
          echo "Confirmed the expected missing-route HTTP 404 diagnostic."
        env:
          CI: 'true'
      - name: Verify accessibility diagnostic
        id: accessibility_negative
        if: always() && steps.build.outcome == 'success'
        run: |
          output="$RUNNER_TEMP/browser-accessibility-negative.log"
          if npm run \
            test:browser:accessibility-negative >"$output" 2>&1; then
            cat "$output"
            echo "Expected the controlled accessibility fixture to fail."
            exit 1
          fi
          cat "$output"
          grep -F 'Accessibility violations detected on in-memory accessibility failure fixture.' "$output"
          grep -F 'Element: img' "$output"
          grep -F 'Rule: image-alt' "$output"
          grep -F 'Next step:' "$output"
          echo "Confirmed actionable diagnostics for the in-memory accessibility fixture."
        env:
          CI: 'true'
      - name: Verify responsive diagnostic
        id: responsive_negative
        if: always() && steps.build.outcome == 'success'
        run: |
          output="$RUNNER_TEMP/browser-responsive-negative.log"
          if npm run \
            test:browser:responsive-negative >"$output" 2>&1; then
            cat "$output"
            echo "Expected the controlled responsive fixture to fail."
            exit 1
          fi
          cat "$output"
          grep -F 'Responsive usability failure on in-memory responsive failure fixture at 320px: whole-page horizontal overflow' "$output"
          grep -F 'Affected elements: div (' "$output"
          grep -F 'Next step: inspect the reported route at this viewport' "$output"
          echo "Confirmed actionable diagnostics for the in-memory responsive fixture."
        env:
          CI: 'true'
      - name: Summarize rendered-site checks
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          NEGATIVE_OUTCOME: ${{ steps.negative.outcome }}
          ACCESSIBILITY_NEGATIVE_OUTCOME: ${{ steps.accessibility_negative.outcome }}
          RESPONSIVE_NEGATIVE_OUTCOME: ${{ steps.responsive_negative.outcome }}
          RESULTS_FILE: ${{ runner.temp }}/browser-results.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const outcome = (value) => {
            if (value === 'success') return 'passed';
            if (value === 'failure') return 'failed';
            return 'not completed';
          };
          const tests = [];
          let reportUnavailableReason = 'Playwright JSON report was not produced; the build or browser test step may not have completed';
          let playwrightDuration;

          if (fs.existsSync(process.env.RESULTS_FILE)) {
            try {
              const report = JSON.parse(fs.readFileSync(process.env.RESULTS_FILE, 'utf8'));
              if (!Array.isArray(report.suites)) {
                throw new Error('Playwright JSON report has no suite list');
              }

              playwrightDuration = report.stats?.duration ?? report.duration;
              const collect = (suite) => {
                for (const spec of suite.specs ?? []) {
                  for (const test of spec.tests ?? []) {
                    const result = test.results?.at(-1);
                    tests.push({
                      title: spec.title,
                      status: result?.status ?? 'not completed',
                      duration: result?.duration,
                      annotations: test.annotations ?? [],
                      axeScanned: test.annotations?.some(
                        (annotation) => annotation.type === 'axe-scan-complete',
                      ) ?? false,
                      diagnostic: [...new Set([
                        result?.error?.message,
                        ...(result?.errors ?? []).map((error) => error.message),
                      ].filter(Boolean))].join('\n'),
                    });
                  }
                }
                for (const child of suite.suites ?? []) collect(child);
              };
              for (const suite of report.suites ?? []) collect(suite);
              if (tests.length === 0) {
                reportUnavailableReason = 'Playwright JSON report contained no test cases';
              } else {
                reportUnavailableReason = undefined;
              }
            } catch {
              reportUnavailableReason = 'Playwright JSON report was unreadable or malformed';
            }
          }

          const statusCounts = (items) => ({
            passed: items.filter((test) => test.status === 'passed').length,
            failed: items.filter((test) => !['passed', 'skipped', 'not completed'].includes(test.status)).length,
            skipped: items.filter((test) => test.status === 'skipped').length,
            incomplete: items.filter((test) => test.status === 'not completed').length,
          });
          const routeTests = tests.filter(
            (test) => test.title.endsWith('is present in generated output and loads'),
          );
          const axeTests = tests.filter(
            (test) => test.title.endsWith('has no detectable accessibility violations'),
          );
          const responsiveTests = tests.filter(
            (test) => test.title.startsWith('Responsive usability: '),
          );
          const responsiveCases = responsiveTests.map((test) =>
            test.title.match(/^Responsive usability: (.+) at (\d+)px$/),
          ).filter(Boolean);
          const responsiveRoutes = [...new Set(responsiveCases.map((match) => match[1]))].sort();
          const responsiveViewports = [...new Set(responsiveCases.map((match) => Number(match[2])))].sort((a, b) => a - b);
          const routeCounts = statusCounts(routeTests);
          const axeCounts = statusCounts(axeTests);
          const responsiveCounts = statusCounts(responsiveTests);
          const allBrowserCounts = statusCounts(tests);
          const scansCompleted = axeTests.filter((test) => test.axeScanned).length;
          const responsiveDuration = responsiveTests.reduce((total, test) => total + (test.duration ?? 0), 0);
          const responsiveDurationCount = responsiveTests.filter((test) => Number.isFinite(test.duration)).length;
          const hitAreas = responsiveTests.flatMap((test) =>
            test.annotations
              .filter((annotation) => annotation.type === 'responsive-hit-area')
              .map((annotation) => annotation.description),
          );
          const smallestHitArea = (region) => {
            const areas = hitAreas
              .filter((area) => area.startsWith(`${region}:`))
              .map((area) => {
                const match = area.match(/^([^:]+):(.+):([\d.]+)x([\d.]+)$/);
                return match ? { label: match[2], width: Number(match[3]), height: Number(match[4]) } : undefined;
              })
              .filter(Boolean)
              .sort((left, right) => left.width * left.height - right.width * right.height);
            return areas[0];
          };
          const smallestNavigationTarget = smallestHitArea('navigation');
          const smallestFooterTarget = smallestHitArea('footer');
          const noAxeViolations =
            axeTests.length > 0 &&
            scansCompleted === axeTests.length &&
            axeCounts.passed === axeTests.length;
          const lines = [
            '# Site: Rendering Integrity',
            '',
            `- Production build (GitHub step \`Build site\`): **${outcome(process.env.BUILD_OUTCOME)}**.`,
            `- Browser suite (GitHub step \`Run rendered-site smoke tests\`): **${outcome(process.env.SMOKE_OUTCOME)}**.`,
          ];

          if (reportUnavailableReason) {
            lines.push(
              `- Smoke route checks: **not available** (${reportUnavailableReason})`,
              `- Responsive usability: **not available** (${reportUnavailableReason}); route counts, viewport counts, and duration are unavailable, not zero.`,
              `- Full-site axe results: **not available** (${reportUnavailableReason})`,
              '- Route counts and Playwright duration are unavailable, not zero.',
            );
          } else {
            const responsiveSummary = responsiveTests.length === 0
              ? '- Responsive usability: **not available** (Playwright report contains no responsive cases; the browser step may not have reached that test file); route counts, viewport counts, and duration are unavailable, not zero.'
              : `- Responsive usability: **${responsiveCounts.passed}/${responsiveTests.length} passed, ${responsiveCounts.failed} failed, ${responsiveCounts.skipped} skipped, ${responsiveCounts.incomplete} not completed** across ${responsiveRoutes.length ? responsiveRoutes.map((route) => `\`${route}\``).join(', ') : 'unavailable routes'} at ${responsiveViewports.length ? responsiveViewports.map((width) => `${width}px`).join(', ') : 'unavailable viewports'}; checked document/main overflow, control visibility/bounds, and navigation/footer operability; sum of individual test durations: **${responsiveDurationCount ? `${(responsiveDuration / 1000).toFixed(1)}s` : 'unavailable'}**.`;
            lines.push(
              `- Generated routes smoke-tested: **${routeTests.length}**; route checks **${routeCounts.passed}/${routeTests.length} passed, ${routeCounts.failed} failed, ${routeCounts.skipped} skipped, ${routeCounts.incomplete} not completed**.`,
              responsiveSummary,
              `- Smallest measured link targets (Playwright touch emulation, CSS pixels; measurement only, not a pass/fail threshold): navigation **${smallestNavigationTarget ? `${smallestNavigationTarget.width}×${smallestNavigationTarget.height}px (${smallestNavigationTarget.label})` : 'unavailable'}**; footer **${smallestFooterTarget ? `${smallestFooterTarget.width}×${smallestFooterTarget.height}px (${smallestFooterTarget.label})` : 'unavailable'}**.`,
              `- Full-site axe accessibility (generated HTML route test cases from \`_site\`): **${scansCompleted}/${axeTests.length} scans completed; ${axeCounts.passed} passed, ${axeCounts.failed} failed, ${axeCounts.skipped} skipped, ${axeCounts.incomplete} not completed${noAxeViolations ? '; no violations detected' : ''}**.`,
              `- Browser tests overall: **${allBrowserCounts.passed} passed, ${allBrowserCounts.failed} failed, ${allBrowserCounts.skipped} skipped, ${allBrowserCounts.incomplete} not completed** (${tests.length} total).`,
              `- Playwright duration (from JSON report): **${Number.isFinite(playwrightDuration) ? `${(playwrightDuration / 1000).toFixed(1)}s` : 'not available in report'}**.`,
              '- Sources: route cases come from generated `_site` HTML discovery; responsive routes/viewports come from the Circle-specific test matrix; counts, statuses, target measurements, and durations come from Playwright JSON; build and diagnostic outcomes come from GitHub steps.',
            );
          }

          if (!reportUnavailableReason &&
            (routeTests.length === 0 || axeTests.length === 0 || scansCompleted !== axeTests.length ||
              responsiveTests.length === 0 || responsiveCases.length !== responsiveTests.length)) {
            lines.push(
              '- Coverage verification: **failed**; the report must contain smoke and responsive cases, every responsive case must identify its route and viewport, and every generated HTML route case must record a completed axe scan.',
            );
            process.exitCode = 1;
          }

          if (reportUnavailableReason && process.env.SMOKE_OUTCOME === 'success') {
            lines.push(
              '- Coverage results: **failed verification**; the browser step succeeded but its Playwright report has no usable test cases.',
            );
            process.exitCode = 1;
          }

          const failedTests = tests.filter((test) => test.status !== 'passed');
          if (failedTests.length > 0) {
            lines.push('', '### Non-passing browser tests');
            for (const test of failedTests) {
              lines.push(`- **${test.status}:** \`${test.title}\`.`);
              if (test.diagnostic) {
                lines.push(
                  ...test.diagnostic.split('\n').map((line) => `  ${line}`),
                );
              }
            }
            lines.push(
              '- See the exact GitHub step **Run rendered-site smoke tests** for full Playwright/axe diagnostics and stack traces.',
            );
          } else if (reportUnavailableReason) {
            lines.push(
              '- Inspect the exact GitHub step **Run rendered-site smoke tests** for Playwright output and report-generation errors.',
            );
          }

          if (process.env.NEGATIVE_OUTCOME === 'success') {
            lines.push(
              '- Missing-route diagnostic (GitHub step `Verify missing-route diagnostic`): **passed**; the deliberate HTTP 404 is expected, not a site regression.',
            );
          } else if (process.env.NEGATIVE_OUTCOME === 'failure') {
            lines.push(
              '- Missing-route diagnostic (GitHub step `Verify missing-route diagnostic`): **failed**; inspect that step logs. This deliberate HTTP 404 is not itself a site regression.',
            );
          } else {
            lines.push(
              '- Missing-route diagnostic (GitHub step `Verify missing-route diagnostic`): **not completed**; inspect earlier step logs. Its deliberate HTTP 404 is expected.',
            );
          }

          if (process.env.ACCESSIBILITY_NEGATIVE_OUTCOME === 'success') {
            lines.push(
              '- In-memory axe diagnostic (GitHub step `Verify accessibility diagnostic`): **passed**; the deliberate `image-alt` failure produced actionable details and is not a site-page finding.',
            );
          } else if (process.env.ACCESSIBILITY_NEGATIVE_OUTCOME === 'failure') {
            lines.push(
              '- In-memory axe diagnostic (GitHub step `Verify accessibility diagnostic`): **failed**; inspect that step logs. The deliberate fixture is not a site page.',
            );
          } else {
            lines.push(
              '- In-memory axe diagnostic (GitHub step `Verify accessibility diagnostic`): **not completed**; inspect earlier step logs. The fixture exists only in memory.',
            );
          }

          if (process.env.RESPONSIVE_NEGATIVE_OUTCOME === 'success') {
            lines.push(
              '- In-memory responsive diagnostic (GitHub step `Verify responsive diagnostic`): **passed**; the deliberate 320px page-overflow fixture produced actionable details and is not a site-page finding.',
            );
          } else if (process.env.RESPONSIVE_NEGATIVE_OUTCOME === 'failure') {
            lines.push(
              '- In-memory responsive diagnostic (GitHub step `Verify responsive diagnostic`): **failed**; inspect that step logs. The deliberate fixture is not a site-page finding.',
            );
          } else {
            lines.push(
              '- In-memory responsive diagnostic (GitHub step `Verify responsive diagnostic`): **not completed**; inspect earlier step logs. The fixture exists only in memory.',
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `${lines.join('\n')}\n`,
          );
          NODE
