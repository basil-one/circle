name: "Site: Build Integrity"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  site-build-integrity:
    name: "Site: Build Integrity"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout intended revision
        id: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
        env:
          BUNDLE_FROZEN: 'true'
      - name: Build site
        id: build
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Verify repository changelog is not a generated page
        id: changelog
        run: test ! -e _site/CHANGELOG.html
      - name: Summarize production build
        if: always()
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CHANGELOG_OUTCOME: ${{ steps.changelog.outcome }}
        run: |
          summary_outcome() {
            case "$1" in
              success) printf -- "- %s: **passed**.\n" "$2" ;;
              failure) printf -- "- %s: **failed**; see logs.\n" "$2" ;;
              *) printf -- "- %s: **not completed**; see prior logs.\n" "$2" ;;
            esac
          }
          {
            echo "# Site: Build Integrity"
            echo
            echo "Checked-out revision: \`${SOURCE_SHA:-unavailable}\`."
            echo
            summary_outcome "$BUILD_OUTCOME" "Production Jekyll build"
            summary_outcome "$CHANGELOG_OUTCOME" "Repository changelog exclusion"
          } >> "$GITHUB_STEP_SUMMARY"
