name: "Paper: Build Integrity"

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-build-integrity:
    name: "Paper: Build Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout intended revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test paper configuration
        id: tests
        run: python3 -m unittest discover -s tests/paper -p 'test_config.py' -v

      - name: Build and verify fresh author-edition PDF
        id: build
        run: bash scripts/build-paper-pdf.sh

      - name: Upload PDF preview
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: circle3-paper-preview
          path: assets/pdfs/circle3-paper.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Summarize paper build
        if: ${{ always() }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          {
            echo "## Paper: Build Integrity"
            echo
            echo "Checked-out revision: \`${SOURCE_SHA:-unavailable}\`."
            echo "Configuration tests: **${TEST_OUTCOME:-unavailable}**; PDF build: **${BUILD_OUTCOME:-unavailable}**; preview upload: **${UPLOAD_OUTCOME:-unavailable}**."
            echo "Any failed or unavailable step requires inspection of its logs and a rerun."
            echo
            if [ -n "$ARTIFACT_URL" ]; then
              echo "[Download the preview PDF]($ARTIFACT_URL)"
            else
              echo "Preview PDF unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
