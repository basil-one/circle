name: "Paper: Link Integrity"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      status:
        description: Paper Link audit outcome
        value: ${{ jobs.paper-link-integrity.outputs.status }}

permissions:
  contents: read

jobs:
  paper-link-integrity:
    name: "Paper: Link Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.audit.outputs.status }}
    steps:
      - name: Checkout intended revision
        id: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install PDF link audit tools
        id: tools
        run: |
          python3 -m venv "$RUNNER_TEMP/paper-links-venv"
          "$RUNNER_TEMP/paper-links-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r scripts/paper/requirements-links.txt
      - name: Build and verify fresh author-edition PDF
        id: build
        run: bash scripts/build-paper-pdf.sh
      - name: Audit fresh PDF links
        id: audit
        run: |
          set +e
          "$RUNNER_TEMP/paper-links-venv/bin/python" -m scripts.paper.check_links \
            assets/pdfs/circle3-paper.pdf --report "$RUNNER_TEMP/paper-link-report.md" \
            --json-report "$RUNNER_TEMP/paper-link-report.json" \
            --status-file "$RUNNER_TEMP/paper-link-status"
          result=$?
          set -e
          outcome="$(cat "$RUNNER_TEMP/paper-link-status" 2>/dev/null || true)"
          case "$outcome:$result" in
            passed:0) status=success ;;
            failed:*) status=failure ;;
            advisory:3) status=advisory ;;
            *) status=incomplete ;;
          esac
          if [ "$status" = failure ] || [ "$status" = incomplete ]; then
            echo "status=$status" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/paper-link-report.md" ] || [ ! -s "$RUNNER_TEMP/paper-link-report.json" ]; then
            echo "status=incomplete" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Test PDF link auditor
        id: tests
        if: ${{ always() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        run: '"$RUNNER_TEMP/paper-links-venv/bin/python" -m unittest discover -s tests/paper -p test_links.py -v'
      - name: Upload link audit evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-link-report
          path: |
            ${{ runner.temp }}/paper-link-report.json
            ${{ runner.temp }}/paper-link-report.md
          if-no-files-found: error
          retention-days: 30
      - name: Summarize link integrity
        if: always()
        env:
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          step_outcome() {
            case "$1" in
              success) printf -- "- %s: **passed**.\n" "$2" ;;
              failure) printf -- "- %s: **failed**; see logs.\n" "$2" ;;
              skipped) printf -- "- %s: **skipped**; evidence is unavailable.\n" "$2" ;;
              *) printf -- "- %s: **not completed**; inspect prior steps.\n" "$2" ;;
            esac
          }
          {
            echo "# Paper: Link Integrity"
            echo
            echo "Checked-out revision: \`${SOURCE_SHA:-unavailable}\`."
            step_outcome "${BUILD_OUTCOME:-unknown}" "Fresh PDF build"
            step_outcome "${TOOLS_OUTCOME:-unknown}" "PDF link audit tools"
            step_outcome "${TEST_OUTCOME:-unknown}" "Link auditor tests"
            step_outcome "${UPLOAD_OUTCOME:-unknown}" "Report upload"
            if [ "$AUDIT_STATUS" = failure ]; then
              echo "- Overall verification: **failed**; confirmed defects take precedence over incomplete evidence."
            elif [ "$AUDIT_STATUS" = incomplete ] || [ "$AUDIT_OUTCOME" != success ]; then
              echo "- Overall verification: **incomplete**; the audit did not establish a pass or advisory."
            elif [ "$BUILD_OUTCOME" != success ] || [ "$TOOLS_OUTCOME" != success ] || [ "$TEST_OUTCOME" != success ] || [ "$UPLOAD_OUTCOME" != success ]; then
              echo "- Overall verification: **incomplete**; supporting checks or report evidence are unavailable."
            else
              case "$AUDIT_STATUS" in
                success) echo "- Overall verification: **passed**." ;;
                advisory) echo "- Overall verification: **advisory**; uncertain external responses remain non-blocking." ;;
                *) echo "- Overall verification: **incomplete or unknown**; inspect audit status and logs." ;;
              esac
            fi
            echo
            if [ -f "$RUNNER_TEMP/paper-link-report.md" ]; then
              cat "$RUNNER_TEMP/paper-link-report.md"
            else
              printf '%s\n' '**Audit report: unavailable or incomplete.**' \
                'Audit evidence unavailable. Inspect earlier steps and rerun.'
            fi
            if [ "$UPLOAD_OUTCOME" = success ] && [ -n "$ARTIFACT_URL" ]; then
              echo "[Download the JSON findings]($ARTIFACT_URL)"
            else
              echo "JSON evidence artifact unavailable (${UPLOAD_OUTCOME:-unknown}); inspect the upload step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
