name: "Common: Code Quality"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  common-code-quality:
    name: "Common: Code Quality"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked-out revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Load Super-Linter configuration
        run: cat .github/linters/super-linter.env >> "$GITHUB_ENV"
      - name: Check Gemfile syntax
        id: ruby_syntax
        run: ruby -c Gemfile
      - name: GitHub Actions validation
        id: jactionlint
        uses: jdx/jactionlint@72c00452809bcca05b8bc12acdcf15dd7a9c1c5e # v2.6.0
        with:
          version: 2.6.0
          profile: correctness
          online: false
          color: false
      - name: Verify invalid permissions are rejected
        id: invalid_permissions
        env:
          JACTIONLINT_EXECUTABLE: ${{ steps.jactionlint.outputs.executable }}
        run: |
          fixture="$(mktemp)"
          output="$(mktemp)"
          trap 'rm -f "$fixture" "$output"' EXIT
          cat > "$fixture" <<'YAML'
          name: Invalid permission fixture
          on: push
          permissions:
            invalid-permission-scope: read
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo "fixture"
          YAML
          if "$JACTIONLINT_EXECUTABLE" --profile correctness --color=never "$fixture" >"$output" 2>&1; then
            echo "jactionlint accepted the invalid permission fixture"
            exit 1
          fi
          if ! grep -Fq 'unknown permission scope "invalid-permission-scope"' "$output"; then
            echo "jactionlint rejected the fixture for an unexpected reason"
            exit 1
          fi
      - name: Test daily quality orchestration and Pulse
        id: pulse_tests
        run: npm run test:quality-pulse
      - name: Test required-check contracts
        id: repository_contracts
        run: npm run test:required-checks
      - name: Test paper release logic
        id: paper_release_tests
        run: python3 -m unittest discover -s tests/paper -p 'test_release.py' -v
      - name: Test paper publication integrity
        id: publication_tests
        run: python3 -m unittest discover -s tests/paper -p 'test_publication_integrity.py' -v
      - name: Test generated-site route discovery
        id: route_tests
        run: npm run test:site-routes
      - name: Test rendering summary and coverage
        id: rendering_tests
        run: npm run test:rendering-summary
      - name: Super-Linter
        id: super_linter
        uses: super-linter/super-linter/slim@v9.0.0
      - name: Summarize source quality
        if: always()
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
          RUBY_OUTCOME: ${{ steps.ruby_syntax.outcome }}
          ACTIONS_OUTCOME: ${{ steps.jactionlint.outcome }}
          INVALID_PERMISSIONS_OUTCOME: ${{ steps.invalid_permissions.outcome }}
          PULSE_TESTS_OUTCOME: ${{ steps.pulse_tests.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.repository_contracts.outcome }}
          PAPER_RELEASE_OUTCOME: ${{ steps.paper_release_tests.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication_tests.outcome }}
          ROUTE_TESTS_OUTCOME: ${{ steps.route_tests.outcome }}
          RENDERING_TESTS_OUTCOME: ${{ steps.rendering_tests.outcome }}
          LINTER_OUTCOME: ${{ steps.super_linter.outcome }}
        run: |
          summary_outcome() {
            case "$1" in
              success) printf -- "- %s: **passed**.\n" "$2" ;;
              failure) printf -- "- %s: **failed**; see step logs.\n" "$2" ;;
              *) printf -- "- %s: **not completed**; see prior logs.\n" "$2" ;;
            esac
          }
          {
            echo "# Common: Code Quality"
            echo
            echo "Checked-out revision: \`${SOURCE_SHA:-unavailable}\`."
            echo
            summary_outcome "$RUBY_OUTCOME" "Ruby Gemfile syntax"
            summary_outcome "$ACTIONS_OUTCOME" "GitHub Actions validation (jactionlint)"
            summary_outcome "$INVALID_PERMISSIONS_OUTCOME" "Invalid permission fixture rejected with the expected diagnostic"
            summary_outcome "$PULSE_TESTS_OUTCOME" "Quality Pulse and daily orchestration tests"
            summary_outcome "$CONTRACTS_OUTCOME" "Coherence, workflow, and repository contracts"
            summary_outcome "$PAPER_RELEASE_OUTCOME" "Paper release tests"
            summary_outcome "$PUBLICATION_OUTCOME" "Paper publication integrity tests"
            summary_outcome "$ROUTE_TESTS_OUTCOME" "Generated-site route tests"
            summary_outcome "$RENDERING_TESTS_OUTCOME" "Rendering summary and coverage tests"
            summary_outcome "$LINTER_OUTCOME" "Super-Linter + Ruff C901"
            echo "Linter findings: GitHub annotations and Super-Linter logs."
          } >> "$GITHUB_STEP_SUMMARY"
